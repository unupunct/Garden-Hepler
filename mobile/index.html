<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Garden Helper</title>
<style>
  :root { --bg:#f4f1e8; --card:#fff; --ink:#1b2418; --muted:#5d6a58; --green:#2f6b3a; --line:#d9d4c3; --warn:#fce8c8; --warnink:#5a3a00; --bad:#b3341f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a12; --card:#1f281c; --ink:#e8efe4; --muted:#a3b09d; --green:#79c288; --line:#33402f; --warn:#4a3a14; --warnink:#ffe3a8; --bad:#ff8c78; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, sans-serif; padding-bottom:76px; }
  header { padding:14px 16px 6px; padding-top:max(14px, env(safe-area-inset-top)); }
  h1 { font-size:20px; margin:0; } h2 { font-size:16px; margin:0 0 8px; }
  main { padding:8px 16px 16px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .muted { color:var(--muted); font-size:14px; } .row { display:flex; align-items:center; gap:10px; justify-content:space-between; padding:6px 0; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:10px; margin-bottom:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; } .tile b { display:block; font-size:24px; } .tile.alert b { color:var(--bad); }
  .warn { background:var(--warn); color:var(--warnink); border-radius:10px; padding:8px 12px; margin-bottom:10px; font-weight:600; }
  button, input { font:inherit; } button { min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button.primary { background:var(--green); color:#fff; border-color:var(--green); } button.on { background:var(--green); color:#fff; border-color:var(--green); }
  input { min-height:44px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); width:100%; }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; border:0; border-radius:0; background:transparent; min-height:56px; font-size:13px; color:var(--muted); } nav button[aria-current="page"] { color:var(--green); font-weight:700; }
  img.cam { width:100%; border-radius:10px; background:#111; min-height:120px; }
  .err { color:var(--bad); }
</style>
</head>
<body>
<header><h1 id="title">Garden Helper</h1><div id="sub" class="muted"></div></header>
<main id="main"></main>
<nav id="nav" hidden></nav>
<script src="/app.js"></script>
</body>
</html>
